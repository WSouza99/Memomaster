<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoMaster Web</title>
    <style>
        /* --- ESTILO (CSS) --- */
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --primary: #bb86fc;
            --success: #03dac6;
            --danger: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }
        h1 { text-align: center; color: var(--primary); }
        
        /* Navegação */
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-nav { background-color: #333; color: white; }
        .btn-nav.active { background-color: var(--primary); color: black; }
        
        /* Telas */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Card de Estudo */
        .flashcard {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .answer-area { margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .hidden { display: none; }
        
        /* Formulários */
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
        }
        
        /* Botões de Ação */
        .btn-action { width: 100%; padding: 15px; font-size: 1.1em; background: var(--primary); color: #000; margin-top: 10px; }
        .btn-grade { width: 30%; margin: 5px; color: white; }
        .bg-red { background-color: var(--danger); }
        .bg-yellow { background-color: #f1c40f; color: black; }
        .bg-green { background-color: var(--success); color: black; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧠 MemoMaster JS</h1>
        
        <div class="nav">
            <button class="btn-nav active" onclick="showScreen('study')">Estudar</button>
            <button class="btn-nav" onclick="showScreen('add')">Adicionar</button>
            <button class="btn-nav" onclick="showScreen('list')">Lista</button>
        </div>

        <div id="study" class="screen active">
            <div id="stats" style="text-align: center; margin-bottom: 10px; color: #888;"></div>
            
            <div id="card-display" class="flashcard">
                <p style="color: #888; font-style: italic;" id="card-topic">Sem cards</p>
                <h2 id="card-question">Adicione novos cards para começar!</h2>
                
                <div id="answer-section" class="answer-area hidden">
                    <h3 id="card-answer" style="color: var(--primary);"></h3>
                    <div style="margin-top: 20px;">
                        <p>Como foi?</p>
                        <button class="btn-grade bg-red" onclick="processGrade(0)">Errei (0)</button>
                        <button class="btn-grade bg-yellow" onclick="processGrade(3)">Difícil (3)</button>
                        <button class="btn-grade bg-green" onclick="processGrade(5)">Fácil (5)</button>
                    </div>
                </div>
            </div>
            
            <button id="btn-show" class="btn-action" onclick="showAnswer()">Mostrar Resposta</button>
        </div>

        <div id="add" class="screen">
            <h2>Novo Card</h2>
            <input type="text" id="new-topic" placeholder="Matéria (ex: Inglês)">
            <input type="text" id="new-question" placeholder="Pergunta">
            <input type="text" id="new-answer" placeholder="Resposta">
            <button class="btn-action" onclick="addCard()">Salvar Card</button>
        </div>

        <div id="list" class="screen">
            <h2>Meus Cards</h2>
            <button onclick="clearData()" style="background: var(--danger); color: white; margin-bottom: 10px;">Apagar Tudo (Reset)</button>
            <table>
                <thead><tr><th>Matéria</th><th>Pergunta</th><th>Próx. Rev.</th></tr></thead>
                <tbody id="cards-table"></tbody>
            </table>
        </div>
    </div>

    <script>
        /* --- LÓGICA DO PROGRAMA (JAVASCRIPT) --- */
        
        let cards = JSON.parse(localStorage.getItem('cards')) || [];
        let sessionQueue = [];
        let currentCard = null;

        // Ao abrir, prepara a sessão
        window.onload = () => {
            prepareSession();
            renderList();
        };

        function save() {
            localStorage.setItem('cards', JSON.stringify(cards));
            renderList();
        }

        // Navegação de Abas
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
            if(id === 'study') prepareSession();
        }

        // Adicionar Card
        function addCard() {
            const topic = document.getElementById('new-topic').value || "Geral";
            const q = document.getElementById('new-question').value;
            const a = document.getElementById('new-answer').value;

            if (q && a) {
                const today = new Date().toISOString().split('T')[0];
                cards.push({
                    topic: topic, question: q, answer: a,
                    n_revisoes: 0, ef: 2.5, interval: 0,
                    next_review: today
                });
                save();
                alert('Card Adicionado!');
                document.getElementById('new-question').value = '';
                document.getElementById('new-answer').value = '';
            } else {
                alert('Preencha pergunta e resposta');
            }
        }

        // Algoritmo SM-2 (Versão JS)
        function calculateSm2(card, grade) {
            if (grade < 3) {
                card.n_revisoes = 0;
                card.interval = 1;
            } else {
                let new_ef = card.ef + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
                if (new_ef < 1.3) new_ef = 1.3;
                card.ef = new_ef;
                card.n_revisoes += 1;

                if (card.n_revisoes === 1) card.interval = 1;
                else if (card.n_revisoes === 2) card.interval = 6;
                else card.interval = Math.ceil(card.interval * card.ef);
            }
            
            // Calcula data futura
            const today = new Date();
            today.setDate(today.getDate() + card.interval);
            card.next_review = today.toISOString().split('T')[0];
            return card;
        }

        // Sessão de Estudo
        function prepareSession() {
            const today = new Date().toISOString().split('T')[0];
            sessionQueue = cards.filter(c => c.next_review <= today);
            updateStats();
            loadNextCard();
        }

        function updateStats() {
            document.getElementById('stats').innerText = `Pendentes hoje: ${sessionQueue.length}`;
        }

        function loadNextCard() {
            document.getElementById('answer-section').classList.add('hidden');
            document.getElementById('btn-show').style.display = 'block';

            if (sessionQueue.length === 0) {
                document.getElementById('card-topic').innerText = "";
                document.getElementById('card-question').innerText = "Parabéns! Tudo revisado por hoje 🎉";
                document.getElementById('card-answer').innerText = "";
                document.getElementById('btn-show').style.display = 'none';
                currentCard = null;
                return;
            }

            currentCard = sessionQueue[0];
            document.getElementById('card-topic').innerText = currentCard.topic;
            document.getElementById('card-question').innerText = currentCard.question;
            document.getElementById('card-answer').innerText = currentCard.answer;
        }

        function showAnswer() {
            if (!currentCard) return;
            document.getElementById('answer-section').classList.remove('hidden');
            document.getElementById('btn-show').style.display = 'none';
        }

        function processGrade(grade) {
            if (!currentCard) return;
            
            // Atualiza o objeto original dentro do array cards
            const index = cards.indexOf(currentCard);
            if (index > -1) {
                cards[index] = calculateSm2(cards[index], grade);
                save();
            }
            
            sessionQueue.shift(); // Remove da fila
            updateStats();
            loadNextCard();
        }

        // Lista
        function renderList() {
            const tbody = document.getElementById('cards-table');
            tbody.innerHTML = '';
            cards.forEach(c => {
                const row = `<tr><td>${c.topic}</td><td>${c.question}</td><td>${c.next_review}</td></tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearData() {
            if(confirm("Apagar todos os cards?")) {
                cards = [];
                save();
                location.reload();
            }
        }
    </script>
</body>
</html>
